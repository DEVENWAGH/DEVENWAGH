name: refresh stats

on:
  schedule:
    # 05:17 UTC daily.  Offset from the hour to avoid GitHub's busy window.
    - cron: "17 5 * * *"
  workflow_dispatch:
  # No `push` trigger — this workflow commits, so a push trigger would
  # re-run on its own commit and create a commit-loop.

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The stats script uses only the Python standard library — no pip
      # packages required for this step.
      - name: Generate stats SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      # Generate heading SVGs (fast, pure Python, no API calls)
      - name: Generate heading SVGs
        run: python3 scripts/generate_headings.py

      # Commit only when something actually changed.  Without this guard
      # you get a commit every single night even when nothing moved.
      - name: Commit if changed
        run: |
          FILES="stats.svg streak.svg langs.svg year.svg hd-about.svg hd-stack.svg hd-projects.svg hd-stats.svg hd-streak.svg hd-langs.svg hd-year.svg hd-contact.svg"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "No changes — skipping commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh $(date -u +%Y-%m-%d)"
          git push
